name: Arch health

# NOT A GATE — a weekly report (NAT-G008 Part A, NAT-602.2).
#
# It produces two facts and uploads them as the `arch-health` artifact (30
# days). It never judges them:
#
#   - an ephemeral repo map: dependency-cruiser JSON for each npm stack
#     (arch/<stack>/dep-graph.json). Static imports only, so the graph is a
#     lower bound. It is regenerated each run and never committed: `arch/` is
#     gitignored, and a committed index stays rejected (natabula
#     docs/QUALITY-STACK.md).
#   - knip, report-first (arch/<stack>/knip.json). Unused files, exports and
#     dependencies are findings, not failures. Promoting knip to a gate is a
#     per-repo step after that repo's first cleanup.
#
# Agents read the map before planning a task that touches more than one
# module. Fetch it with `rm -rf arch && gh run download -n arch-health -D arch`
# from the repo root, as AGENTS.md §"Repo map" says.
#
# Findings never turn the run red (NAT-118, facts not grades). A red run means
# a tool failed: an install broke, dependency-cruiser crashed, or knip exited 2
# (its error code; `--no-exit-code` turns only findings into 0). A red run
# uploads nothing, so the newest artifact is the last complete map while one
# is within its 30 days; past that, agents plan from source (NAT-645). A
# scheduled red or timeout opens or comments on one tracking issue (the
# report-failure job, NAT-360.4).
# That is the canary pattern of natabula's templates-typecheck.yml (NAT-213),
# scoped to this workflow. It is not the global automatic issue writer that
# docs/CI-HEALTH.md rejects.
#
# Triggers: `schedule` + `workflow_dispatch` only, never push or pull_request
# (A-D1, NAT-602.1). The CI spine's "no workflow_dispatch" rule governs the gate
# workflow, ci.yml. This is a separate non-gate file, which is why it is not a
# job on ci.yml.
#
# flaitron's adapted copy (CORE-901) of natabula's
# configs/.github/workflows/arch-health.yml. The Part A wave cannot reach a
# self-host, and the unchanged file would detect no stack here. Deltas from
# the source: the one npm stack is viz/ (no root, frontend/, worker/ or
# landing/, so the detect loop and the lockfile list name viz only); Node 24
# (viz's `engines`); every action pinned to a full-length commit SHA
# (SECURITY.md §"GitHub Actions CI"); and the uv/pydeps steps are dropped, as
# flaitron has no Python stack. A fifth: a missing viz/ fails the detect step
# instead of skipping to a green, empty run. The npm report step's script is
# kept byte-identical on purpose, root-stack branches included (unreachable
# here), so it diffs cleanly against natabula's file when re-syncing. Doc
# paths cited below without a repo name are natabula's.

on:
  schedule:
    # Mondays, 05:43 UTC. Off the hour on purpose — GitHub drops scheduled runs
    # under load at popular cron minutes.
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arch-health-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the tool, not the image (docs/STACK-TENDENCIES.md §"Continuous
  # integration" → Runner image). TypeScript is pinned beside
  # dependency-cruiser because the cruiser parses .ts only when `typescript`
  # resolves from its own install (its supported range is >=2 <7).
  DEPCRUISE_VERSION: '18.7.2'
  TYPESCRIPT_VERSION: '6.0.3'
  KNIP_VERSION: '6.45.1'

jobs:
  report:
    name: repo map + knip
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Detect layout
        id: layout
        run: |
          npm=''
          for d in viz; do
            if [ -f "$d/package.json" ] && [ -f "$d/package-lock.json" ]; then
              npm="$npm $d"
            fi
          done
          # viz/ is this repo's only stack: a missing one is a broken report,
          # not an empty one, so it fails the run (and opens the issue).
          [ -n "$npm" ] || { echo "::error::viz/ has no package.json + package-lock.json"; exit 1; }
          echo "npm=${npm# }" >> "$GITHUB_OUTPUT"

      # Node 24 is the lower bound of viz's `engines` (ci.yml tests 24 and 26).
      - name: Set up Node
        if: steps.layout.outputs.npm != ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: viz/package-lock.json

      # The tools go in their own directory, so they never touch a stack's
      # package.json or lockfile.
      - name: Install report tools (npm)
        if: steps.layout.outputs.npm != ''
        run: |
          npm install --prefix "$RUNNER_TEMP/arch-tools" --no-audit --no-fund \
            "dependency-cruiser@$DEPCRUISE_VERSION" \
            "typescript@$TYPESCRIPT_VERSION" \
            "knip@$KNIP_VERSION"

      # Each stack installs first because knip loads its configs (vite,
      # vitest, eslint), which import the stack's own dependencies. The graph
      # covers src/ when the stack has one and the stack directory otherwise.
      # It uses tsconfig.app.json, or tsconfig.json when there is no app config,
      # so path aliases resolve. When the root is a stack, the graph leaves out
      # the other detected stack dirs; root knip may still list their files as
      # unused, which is report noise, never red. `npm ci` runs the stack's
      # install scripts, so a broken install script also goes red.
      - name: Repo map + knip (npm)
        if: steps.layout.outputs.npm != ''
        env:
          STACKS: ${{ steps.layout.outputs.npm }}
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/arch-tools/node_modules/.bin"
          others=''
          for d in $STACKS; do [ "$d" = . ] || others="$others|$d"; done
          for d in $STACKS; do
            name=$d; [ "$d" = . ] && name=root
            out="$GITHUB_WORKSPACE/arch/$name"
            mkdir -p "$out"
            echo "::group::$name"
            (
              cd "$d"
              npm ci --no-audit --no-fund
              src=.; [ -d src ] && src=src
              ts=()
              if   [ -f tsconfig.app.json ]; then ts=(--ts-config tsconfig.app.json)
              elif [ -f tsconfig.json ];     then ts=(--ts-config tsconfig.json); fi
              skip='node_modules|dist|build|coverage|\.wrangler|arch'
              [ "$d" = . ] && skip="$skip$others"
              "$bin/depcruise" "$src" --no-config "${ts[@]}" \
                --exclude "(^|/)($skip)/" \
                --output-type json > "$out/dep-graph.json"
              "$bin/knip" --no-exit-code --reporter json > "$out/knip.json"
              # Unparseable output is a tool failure, not a finding.
              jq empty "$out/dep-graph.json" "$out/knip.json"
            )
            echo "::endgroup::"
          done

      # Success only (NAT-645). A failed tool can leave an empty or truncated
      # JSON file behind, and `gh run download -n arch-health` takes the newest
      # artifact, so uploading after a red would hide the last complete map.
      - name: Upload arch-health
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-health
          path: arch/
          retention-days: 30
          if-no-files-found: warn

  # Where a red lands (NAT-360.4, the same job as templates-typecheck.yml).
  # Schedule only: a workflow_dispatch run already has an operator watching
  # it. One open issue, found by exact title. The first red opens it, each later
  # red comments on it, and a human closes it once the tool is fixed.
  # `issues: write` is granted here only. A job that hits timeout-minutes ends
  # `cancelled`, not `failure`, so the gate reads the result instead of
  # `failure()`. `!cancelled()` is true unless the whole run was cancelled, so
  # a manual or concurrency cancel opens nothing (NAT-645).
  report-failure:
    name: report failure
    needs: [report]
    if: >-
      !cancelled() && github.event_name == 'schedule' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Arch health report is red'
          body="Scheduled run failed or timed out: $RUN_URL"
          # Captured before filtering, not piped: under `bash -e` a failed lookup
          # then fails the step instead of reading as "no issue" and opening a
          # duplicate. awk takes the exact title as data, never as program text.
          matches=$(gh issue list --state open --search "in:title \"$title\"" \
            --json number,title --jq '.[] | [.number, .title] | @tsv')
          number=$(printf '%s\n' "$matches" | awk -F '\t' -v t="$title" '$2 == t { print $1; exit }')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" \
              --body "$body

          A report tool failed or timed out, not a finding (see the header of .github/workflows/arch-health.yml). Fix the install, bump the pinned tool or find the hang, then close this issue. Later reds comment here instead of opening a new one."
          fi
