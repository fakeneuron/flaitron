name: Install test

# install.sh's end-to-end test (CORE-851). It needs the network (GitHub
# releases/latest, git ls-remote, real clones), so its result depends on live
# state as well as the commit. That is why it is a separate workflow,
# path-filtered to the files it tests (or run by hand), and never a step in
# ci.yml's `validate` job (docs/CONVENTIONS.md §"GitHub Actions CI"; §7.1
# Pair H binds that job). The texts install.sh parses (SPEC.md, the
# snippets, ft-adopt) stay out of the filter: the run installs the latest
# released tag, not this tree, so it would not test an edit to them —
# drift-checks.sh's installer_anchors binds those at HEAD (CORE-868.3).

on:
  push:
    branches: [main]
    paths:
      - install.sh
      - tools/install.test.sh
      - .github/workflows/install-test.yml
  pull_request:
    paths:
      - install.sh
      - tools/install.test.sh
      - .github/workflows/install-test.yml
  workflow_dispatch:

concurrency:
  group: install-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: shellcheck (POSIX sh)
        run: shellcheck -s sh install.sh tools/install.test.sh

  e2e:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # ubuntu's sh is dash; macOS's sh is bash in POSIX mode.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: install, rerun, pinned update, update to latest, refusals (sh)
        run: sh tools/install.test.sh install.sh sh
      - name: same, under bash --posix
        if: runner.os == 'Linux'
        run: sh tools/install.test.sh install.sh bash --posix
