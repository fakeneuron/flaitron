name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # update-adopters tests clone this checkout and check out historical
          # release tags for behind/drift fixtures. Default depth-1 omits tags.
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: viz/package-lock.json
      - run: npm --prefix viz ci
      - run: npm --prefix viz test
      # Stays standalone although `build` runs `typecheck` too (FE-141): the
      # repeat is a warm `tsc -b` (~0.2s), and a type error fails a step named
      # for it. AGENTS.md §"Validation" lists it as its own command (FE-143).
      - run: npm --prefix viz run typecheck
      - run: npm --prefix viz run lint
      - run: npm --prefix viz run build
      - run: node --test tools/update-adopters.test.mjs
      - run: node --check tools/update-adopters.test.mjs
      - run: node --check tools/update-adopters.mjs
      - run: node --test tools/drift-checks.test.mjs

      # Stack-agnostic (docs-only repos included), so it sits on `validate`
      # rather than a stack-specific lane. The baseline `.gitleaks.toml` is
      # a deposited copy at repo root (CORE-578), so --config reads it in
      # place rather than fetching it from anywhere.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o "$RUNNER_TEMP/$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$TARBALL"
          curl -sSL -o "$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          ( cd "$RUNNER_TEMP" && sha256sum --ignore-missing --check "gitleaks_${GITLEAKS_VERSION}_checksums.txt" )
          tar -xz -C "$RUNNER_TEMP" -f "$RUNNER_TEMP/$TARBALL" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --no-banner --redact

  # Cross-file drift checks — the release-context-free subset of /ft-release
  # §7.1 (plus SPEC/layout.md §"Skill namespace"), so drift is caught on the commit
  # that lands it instead of at the next cut. §7.1 remains the release gate and
  # the broader superset; nothing here replaces it.
  #
  # The shell lives in tools/drift-checks.sh (CORE-734.2), which §7.1 runs too;
  # its header carries the design notes. Keep the step in the `- name:` +
  # `run:` shape: §7.1 Pair H extracts the `validate` job's commands with
  # `grep -E '^      - run: '` and diffs them against AGENTS.md §"Validation",
  # so a single-line `- run:` here would leak into that extraction and break
  # the release gate.
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Drift checks (tools/drift-checks.sh)
        run: bash tools/drift-checks.sh

  # Changed-line coverage for viz (FE-151, after natabula NAT-229): fails when
  # under COVERAGE_MIN% of the lines a push or PR adds or changes are covered.
  # Never a whole-project percentage. `just coverage` is the local mirror;
  # bump the pin and threshold in both together. Every step uses `- name:` +
  # `run:` so Pair H's `      - run: ` extraction (validate's roster) never
  # sees it. diff-cover runs via the runner image's preinstalled pipx, so no
  # third-party action is added.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DIFF_COVER_VERSION: '10.5.1'
      COVERAGE_MIN: '80'
    steps:
      # Full history: a shallow clone cannot resolve the push's previous head,
      # and the gate would then score nothing and pass.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: viz/package-lock.json
      - name: Install (npm)
        run: npm --prefix viz ci
      - name: Test with coverage (vitest)
        run: npm --prefix viz test -- --coverage
      - name: Resolve coverage diff base
        id: covbase
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Values arrive as env vars, never interpolated into the script, so
          # a branch name cannot inject shell. No base — a branch-creating
          # push (all-zero `before`) or a force-push whose `before` is gone —
          # skips the gate, with a notice so the green run is not mistaken
          # for a pass.
          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$PR_BASE"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          else
            echo "::notice::coverage gate skipped: no diff base for this push (before=$PUSH_BEFORE)"
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
      - name: Coverage (changed lines, viz)
        if: steps.covbase.outputs.ref != ''
        env:
          BASE: ${{ steps.covbase.outputs.ref }}
        run: |
          set -euo pipefail
          # lcov SF: paths are viz-relative; git diff paths are repo-root
          # relative, and --src-roots does not remap lcov. Without this rewrite
          # the gate reports "No lines with coverage information" and passes.
          sed -i 's|^SF:|SF:viz/|' viz/coverage/lcov.info
          pipx run "diff-cover==${DIFF_COVER_VERSION}" viz/coverage/lcov.info \
            --compare-branch="$BASE" --fail-under="$COVERAGE_MIN" --show-uncovered
